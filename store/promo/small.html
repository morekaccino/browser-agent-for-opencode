<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background: #171120;
        color: #f4efff;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(90% 120% at 100% 0%, rgba(138, 107, 224, 0.55), transparent 60%),
          radial-gradient(80% 100% at 0% 100%, rgba(239, 184, 200, 0.18), transparent 60%),
          linear-gradient(135deg, #1b1428, #241b36 55%, #171120);
      }
      .grid {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: radial-gradient(80% 80% at 70% 30%, black, transparent 75%);
      }
      .content {
        position: relative;
        display: flex;
        align-items: center;
        gap: 26px;
        height: 100%;
        padding: 0 34px;
      }
      .icon {
        width: 112px;
        height: 112px;
        flex: none;
        filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.36));
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        color: #d0bcff;
        font-weight: 600;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 36px;
        letter-spacing: -0.6px;
        font-weight: 650;
        white-space: nowrap;
      }
      .for {
        margin: 2px 0 12px;
        font-size: 19px;
        line-height: 24px;
        color: #cac4d0;
        font-weight: 400;
      }
      .tagline {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: #e8def8;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: 18px;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(208, 188, 255, 0.14);
        border: 1px solid rgba(208, 188, 255, 0.26);
        color: #eaddff;
        font-size: 11px;
        letter-spacing: 0.2px;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #9bf6b5; }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="grid"></div>
    <div class="content">
      <img class="icon" src="../icon/icon.svg" alt="" />
      <div>
        <div class="kicker">Chrome side panel</div>
        <h1>Browser Agent</h1>
        <div class="for">for opencode</div>
        <p class="tagline">Your browser, with an agent.</p>
        <div class="pill"><span class="dot"></span> local bridge · no account</div>
      </div>
    </div>
  </body>
</html>
